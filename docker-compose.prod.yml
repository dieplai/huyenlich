services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: huyenlich_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - huyenlich-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: huyenlich_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - DATA_DIR=/app/data
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:8301:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - huyenlich-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: huyenlich_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - huyenlich_postgres_data:/var/lib/postgresql/data
    networks:
      - huyenlich-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: huyenlich_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - huyenlich_redis_data:/data
    networks:
      - huyenlich-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  huyenlich-network:
    name: huyenlich-network
    driver: bridge

volumes:
  huyenlich_postgres_data:
    name: huyenlich_postgres_data
  huyenlich_redis_data:
    name: huyenlich_redis_data
