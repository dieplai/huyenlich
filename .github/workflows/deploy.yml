name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VPS_PROJECT_PATH: ${{ vars.VPS_PROJECT_PATH || '/opt/huyenlich' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: AI_API_KEY,JWT_SECRET,VPS_PROJECT_PATH
          script: |
            set -euo pipefail

            PROJECT_PATH="${VPS_PROJECT_PATH:-/opt/huyenlich}"
            REPO_URL="https://github.com/dieplai/huyenlich.git"

            mkdir -p "$(dirname "$PROJECT_PATH")"
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              if [ -d "$PROJECT_PATH" ] && [ -n "$(ls -A "$PROJECT_PATH" 2>/dev/null)" ]; then
                echo "[deploy] $PROJECT_PATH exists and is not an empty Git repo; refusing to overwrite."
                exit 1
              fi
              git clone "$REPO_URL" "$PROJECT_PATH"
            fi

            cd "$PROJECT_PATH"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "[deploy] creating .env"
              POSTGRES_PASSWORD_VALUE="$(openssl rand -hex 24)"
              JWT_SECRET_VALUE="${JWT_SECRET:-$(openssl rand -hex 32)}"
              cat > .env << EOF
            SERVER_PORT=8080
            POSTGRES_USER=huyenlich
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD_VALUE}
            POSTGRES_DB=huyenlich
            DATABASE_URL=postgres://huyenlich:${POSTGRES_PASSWORD_VALUE}@postgres:5432/huyenlich?sslmode=disable
            REDIS_URL=redis://redis:6379/0
            JWT_SECRET=${JWT_SECRET_VALUE}
            AI_BASE_URL=https://ckey.vn/v1
            AI_API_KEY=${AI_API_KEY:-}
            AI_MODEL=gpt-5.5
            AI_FAST_MODEL=gpt-5.4-mini
            AI_WRITER_MODEL=gpt-5.4
            DATA_DIR=/app/data
            EOF
              sed -i 's/^[[:space:]]*//' .env
              chmod 600 .env
            fi

            if [ ! -f /etc/nginx/sites-available/huyenlich.io.vn ]; then
              cp deploy/nginx/huyenlich.io.vn.conf /etc/nginx/sites-available/huyenlich.io.vn
              ln -s /etc/nginx/sites-available/huyenlich.io.vn /etc/nginx/sites-enabled/huyenlich.io.vn
            fi

            docker compose -f docker-compose.prod.yml up -d --build
            nginx -t
            systemctl reload nginx

            curl -fsS http://127.0.0.1:8301/health >/dev/null
            curl -fsS http://127.0.0.1:3400 >/dev/null
            docker compose -f docker-compose.prod.yml ps
